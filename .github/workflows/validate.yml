name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'PyYAML==6.0.2'
      - run: python tools/build_collection.py --check
      - run: python tools/validate_collection.py
      - run: python -m compileall -q manage.py tools
      - run: bash -n install.sh
      - name: Install Hermes Agent for distribution E2E
        run: |
          python -m pip install \
            'git+https://github.com/NousResearch/hermes-agent.git@e4ea0a0ed7fc24761b2b425146893561a73216e1'
      - run: python tools/e2e_collection.py
  windows-syntax:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
